[project]
name = "railside"
version = "0.1.1"
license = "AGPL-3.0-only"
description = "地铁列车侧面线阵图像视觉检测：拼接、标定、模板车、对齐、零件比对与告警"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "mcp>=2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
# 检测/分割训练与推理。Windows 上从 PyPI 装的是 CPU 版 torch，Linux 训练机上同一份锁装的是 CUDA 版。
dl = ["ultralytics"]

[project.scripts]
railside = "railside.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "源码"
module-name = "railside"

[tool.uv]
default-groups = ["dev", "dl"]
